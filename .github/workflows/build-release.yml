name: Build Windows portable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Publish win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Project TFM is net10.0-windows; allow newest SDK that can target it.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content .\src\TaskbarLiveStats\TaskbarLiveStats.csproj
          $version = $proj.Project.PropertyGroup.Version | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"
          dotnet --info

      - name: Restore (include win-x64 RID)
        run: >
          dotnet restore .\src\TaskbarLiveStats\TaskbarLiveStats.csproj
          -r win-x64

      - name: Build
        run: >
          dotnet build .\src\TaskbarLiveStats\TaskbarLiveStats.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          --no-restore

      - name: Publish portable (self-contained single-file)
        run: >
          dotnet publish .\src\TaskbarLiveStats\TaskbarLiveStats.csproj
          -c Release
          -r win-x64
          /p:PublishProfile=Trimmed
          --no-restore

      - name: Publish framework-dependent single-file
        run: >
          dotnet publish .\src\TaskbarLiveStats\TaskbarLiveStats.csproj
          -c Release
          -r win-x64
          /p:PublishProfile=FrameworkDependent
          --no-restore

      - name: Stage artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $stamp = Get-Date -Format "yyyyMMdd"

          New-Item -ItemType Directory -Force -Path .\artifacts\portable, .\artifacts\framework-dependent | Out-Null

          Copy-Item .\publish\TaskbarLiveStats.exe `
            .\artifacts\portable\TaskbarLiveStats.exe

          Copy-Item .\publish-fd\TaskbarLiveStats.exe `
            .\artifacts\framework-dependent\TaskbarLiveStats.exe

          # Stable names (used by continuous release + README direct links).
          Compress-Archive -Path .\artifacts\portable\* `
            -DestinationPath ".\artifacts\TaskbarLiveStats-win-x64-portable.zip" -Force
          Compress-Archive -Path .\artifacts\framework-dependent\* `
            -DestinationPath ".\artifacts\TaskbarLiveStats-win-x64-fd.zip" -Force

          # Versioned copies for Actions artifact browsing / tagged releases.
          Copy-Item ".\artifacts\TaskbarLiveStats-win-x64-portable.zip" `
            ".\artifacts\TaskbarLiveStats-win-x64-portable-v$version.zip"
          Copy-Item ".\artifacts\TaskbarLiveStats-win-x64-fd.zip" `
            ".\artifacts\TaskbarLiveStats-win-x64-fd-v$version.zip"

          Copy-Item .\artifacts\portable\TaskbarLiveStats.exe `
            ".\artifacts\TaskbarLiveStats-win-x64-portable.exe"
          Copy-Item .\artifacts\framework-dependent\TaskbarLiveStats.exe `
            ".\artifacts\TaskbarLiveStats-win-x64-fd.exe"

          Copy-Item .\artifacts\portable\TaskbarLiveStats.exe `
            ".\artifacts\TaskbarLiveStats-win-x64-portable-v$version-$stamp-$sha.exe"
          Copy-Item .\artifacts\framework-dependent\TaskbarLiveStats.exe `
            ".\artifacts\TaskbarLiveStats-win-x64-fd-v$version-$stamp-$sha.exe"

          @"
          ## Windows builds ready

          | Package | Recommended |
          | --- | --- |
          | ``TaskbarLiveStats-win-x64-portable`` | Yes — self-contained EXE, no .NET install |
          | ``TaskbarLiveStats-win-x64-framework-dependent`` | Smaller; needs .NET 10 Desktop Runtime |

          ### Where to download
          1. Scroll to **Artifacts** at the bottom of this job summary / run page
          2. Or open the [continuous release](https://github.com/mohantechnology/live-stats/releases/tag/continuous) (updated on every ``main`` push)
          3. Or open [Releases](https://github.com/mohantechnology/live-stats/releases) for version tags (``v*``)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          Get-ChildItem .\artifacts -File | Format-Table Name, Length

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: TaskbarLiveStats-win-x64-portable
          path: |
            artifacts/TaskbarLiveStats-win-x64-portable.zip
            artifacts/TaskbarLiveStats-win-x64-portable.exe
            artifacts/TaskbarLiveStats-win-x64-portable-v*.zip
            artifacts/TaskbarLiveStats-win-x64-portable-v*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v7
        with:
          name: TaskbarLiveStats-win-x64-framework-dependent
          path: |
            artifacts/TaskbarLiveStats-win-x64-fd.zip
            artifacts/TaskbarLiveStats-win-x64-fd.exe
            artifacts/TaskbarLiveStats-win-x64-fd-v*.zip
            artifacts/TaskbarLiveStats-win-x64-fd-v*.exe
          if-no-files-found: error
          retention-days: 30

  publish-continuous:
    name: Update continuous release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v8
        with:
          name: TaskbarLiveStats-win-x64-portable
          path: release-assets

      - name: Download framework-dependent artifact
        uses: actions/download-artifact@v8
        with:
          name: TaskbarLiveStats-win-x64-framework-dependent
          path: release-assets

      - name: Publish continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build (main)
          prerelease: true
          make_latest: false
          body: |
            Auto-updated on every push to `main`.

            **Recommended:** `TaskbarLiveStats-win-x64-portable.zip` or `.exe` (self-contained, Windows 10/11 x64).

            Direct links:
            - [Portable ZIP](https://github.com/mohantechnology/live-stats/releases/download/continuous/TaskbarLiveStats-win-x64-portable.zip)
            - [Portable EXE](https://github.com/mohantechnology/live-stats/releases/download/continuous/TaskbarLiveStats-win-x64-portable.exe)
            - [Framework-dependent ZIP](https://github.com/mohantechnology/live-stats/releases/download/continuous/TaskbarLiveStats-win-x64-fd.zip)
          files: |
            release-assets/TaskbarLiveStats-win-x64-portable.zip
            release-assets/TaskbarLiveStats-win-x64-portable.exe
            release-assets/TaskbarLiveStats-win-x64-fd.zip
            release-assets/TaskbarLiveStats-win-x64-fd.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v8
        with:
          name: TaskbarLiveStats-win-x64-portable
          path: release-assets

      - name: Download framework-dependent artifact
        uses: actions/download-artifact@v8
        with:
          name: TaskbarLiveStats-win-x64-framework-dependent
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/TaskbarLiveStats-win-x64-portable-v*.zip
            release-assets/TaskbarLiveStats-win-x64-portable-v*.exe
            release-assets/TaskbarLiveStats-win-x64-fd-v*.zip
            release-assets/TaskbarLiveStats-win-x64-fd-v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
